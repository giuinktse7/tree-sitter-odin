# Odin outline extraction for ast-grep 0.44.1 and newer.
#
# Item rules intentionally match whole declarations so outline byte ranges can
# reproduce exact definitions. Name and signature text comes only from semantic
# CST fields. An item is eligible only when its immediate parent is source_file
# or declaration_block; procedure-local declarations therefore stay out of the
# file outline.

id: odin-package
language: odin
role: item
symbolType: package
rule:
  all:
    - kind: package_declaration
    - has:
        field: name
        kind: identifier
        pattern: $NAME
    - inside:
        kind: source_file
        stopBy: neighbor
name: $NAME
signature: package $NAME
isImport: false
isExported: false

---

id: odin-import-string
language: odin
role: item
symbolType: module
rule:
  all:
    - kind: import_declaration
    - has:
        field: path
        kind: string
        pattern: $QUOTED_PATH
    - inside:
        any:
          - kind: source_file
          - kind: declaration_block
        stopBy: neighbor
transform:
  PATH:
    substring:
      source: $QUOTED_PATH
      startChar: 1
      endChar: -1
name: $PATH
isImport: true
isExported: false

---

id: odin-import-identifier
language: odin
role: item
symbolType: module
rule:
  all:
    - kind: import_declaration
    - has:
        field: path
        kind: identifier
        pattern: $PATH
    - inside:
        any:
          - kind: source_file
          - kind: declaration_block
        stopBy: neighbor
name: $PATH
isImport: true
isExported: false

---

id: odin-procedure
language: odin
role: item
symbolType: function
rule:
  all:
    - kind: procedure_declaration
    - has:
        field: name
        kind: identifier
        pattern: $NAME
    - has:
        field: value
        kind: procedure
        has:
          field: signature
          kind: procedure_signature
          pattern: $SIGNATURE
    - inside:
        any:
          - kind: source_file
          - kind: declaration_block
        stopBy: neighbor
name: $NAME
signature: '$NAME :: $SIGNATURE'
isImport: false
isExported:
  all:
    - has:
        field: name
        regex: '^[A-Z]'
    - not:
        has:
          kind: attributes
          regex: '(?:@\(|,)\s*private\s*(?:=|,|\))'
          stopBy: neighbor

---

id: odin-overloaded-procedure
language: odin
role: item
symbolType: function
rule:
  all:
    - kind: overloaded_procedure_declaration
    - pattern: $SIGNATURE
    - has:
        field: name
        kind: identifier
        pattern: $NAME
    - inside:
        any:
          - kind: source_file
          - kind: declaration_block
        stopBy: neighbor
name: $NAME
signature: $SIGNATURE
isImport: false
isExported:
  all:
    - has:
        field: name
        regex: '^[A-Z]'
    - not:
        has:
          kind: attributes
          regex: '(?:@\(|,)\s*private\s*(?:=|,|\))'
